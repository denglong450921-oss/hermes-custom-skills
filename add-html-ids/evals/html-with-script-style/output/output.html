<!DOCTYPE html>
<html id="case003_html" lang="en">
<head id="case003_head">
<meta id="case003_meta" charset="UTF-8">
<title id="case003_title">Script/Style Test</title>
<style id="case003_style">
  body { font-family: 'Inter', sans-serif; }
  .hero { background: #f0f0f0; }
</style>
</head>
<body id="case003_body">
<div id="case003_div" class="container">
  <h1 id="case003_h1">Welcome to the world's best site</h1>
  <p id="case003_p">This page tests script & style tag safety.</p>
</div>

<script id="case003_script">
(function() {
  const deck = document.getElementById('deck');
  const slides = document.querySelectorAll('.slide');
  const total = slides.length;
  let current = 0;

  for (let i = 0; i < total; i++) {
    const dot = document.createElement('a');
    dot.href = '#';
    dot.addEventListener('click', function() {
      if (current < total) goTo(i);
    });
    deck.appendChild(dot);
  }

  function goTo(index) {
    if (index < 0 || index >= total) return;
    slides[current].classList.remove('active');
    slides[index].classList.add('active');
    current = index;
  }

  goTo(0);
})();
</script>
</body>
</html>
